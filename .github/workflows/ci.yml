name: WavyGo ERP CI/CD Pipeline

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - master
      - garv-agarwal
      - 'feature/*'

  pull_request:
    branches:
      - main
      - master
      - garv-agarwal

jobs:

  backend-test:
    name: Backend Tests & Quality Checks
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGO_URI: mongodb://127.0.0.1:27017
      MONGO_URL: mongodb://127.0.0.1:27017
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_URL: mongodb://127.0.0.1:27017
      DATABASE_URL: mongodb://127.0.0.1:27017
      DB_NAME: wavygo_ci_isolated

      REACT_APP_BACKEND_URL: http://127.0.0.1:8000

      FOUNDER_EMAIL: founder@wavygo.in
      FOUNDER_NAME: CI Founder
      FOUNDER_PASSWORD: Wavygo-CI-2026-Test!

      ADMIN_EMAIL: admin@wavygo.in
      MANAGER_EMAIL: manager@wavygo.in
      EMPLOYEE_EMAIL: employee@wavygo.in
      INTERN_EMAIL: intern@wavygo.in

      TEST_PASSWORD: Wavygo-CI-2026-Test!

    steps:

      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate CI JWT Secret
        run: |
          echo "JWT_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> "$GITHUB_ENV"

      - name: Start Backend
        working-directory: backend
        run: |
          nohup python -m uvicorn server:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Prepare CI Test Environment
        working-directory: backend
        run: |
          python ci_setup.py

      - name: Show Backend Log If Setup Fails
        if: failure()
        working-directory: backend
        run: |
          cat backend.log || true

      - name: Run Pytest Test Suite
        working-directory: backend
        run: |
          pytest

      - name: Show Backend Log
        if: always()
        working-directory: backend
        run: |
          cat backend.log || true


  frontend-build:
    name: Frontend Build Verification
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps

      - name: Build React Application
        working-directory: frontend
        run: |
          CI=false npm run build
